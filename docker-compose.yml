services:
  postgres:
    image: postgres:17-alpine
    container_name: itsm-postgres
    restart: always
    environment:
      POSTGRES_DB: itsm_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d itsm_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: itsm-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/itsm_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SERVER_PORT: 8080
      APP_TIMEZONE: Asia/Kolkata
      APP_CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
      CHATBOT_ENGINE: ${CHATBOT_ENGINE:-rule}
      CHATBOT_LLM_PROVIDER: ${CHATBOT_LLM_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-5-5}
      FRUSTRATION_ENABLED: ${FRUSTRATION_ENABLED:-true}
      FRUSTRATION_ANNOYED: ${FRUSTRATION_ANNOYED:-25}
      FRUSTRATION_FRUSTRATED: ${FRUSTRATION_FRUSTRATED:-55}
      FRUSTRATION_CRITICAL: ${FRUSTRATION_CRITICAL:-85}
      FRUSTRATION_DECAY_HOURS: ${FRUSTRATION_DECAY_HOURS:-12}
      FRUSTRATION_COOLDOWN_MINUTES: ${FRUSTRATION_COOLDOWN_MINUTES:-30}
      FRUSTRATION_RECHECK_INTERVAL_MS: ${FRUSTRATION_RECHECK_INTERVAL_MS:-60000}
      FRUSTRATION_REPEAT_WINDOW_DAYS: ${FRUSTRATION_REPEAT_WINDOW_DAYS:-7}
      FRUSTRATION_AUTO_ESCALATE: ${FRUSTRATION_AUTO_ESCALATE:-false}
      FRUSTRATION_LLM_SENTIMENT: ${FRUSTRATION_LLM_SENTIMENT:-false}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_FROM: ${MAIL_FROM:-no-reply@itsm.local}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-false}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: itsm-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
