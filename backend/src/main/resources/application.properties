# --- Database ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/itsm_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:@ditya}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false

# --- JWT (override APP_JWT_SECRET in any real deployment) ---
app.jwt.secret=${APP_JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# --- CORS ---
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# --- SLA monitor ---
# How often open incidents are checked for warnings, breaches and escalation.
app.sla.monitor-interval-ms=${APP_SLA_MONITOR_INTERVAL_MS:60000}
app.sla.escalation-enabled=${APP_SLA_ESCALATION_ENABLED:true}

# --- Assignment ---
# Route new incidents to a technician immediately using the active assignment strategy.
app.assignment.auto-on-create=${APP_AUTO_ASSIGN_ON_CREATE:true}

# --- Chatbot (local strategy works without API keys) ---
app.chatbot.engine=${CHATBOT_ENGINE:rule}
app.chatbot.llm.provider=${CHATBOT_LLM_PROVIDER:gemini}
app.chatbot.llm.gemini-key=${GEMINI_API_KEY:}
app.chatbot.llm.anthropic-key=${ANTHROPIC_API_KEY:}
app.chatbot.llm.gemini-model=${GEMINI_MODEL:gemini-3.8-flash}
app.chatbot.llm.anthropic-model=${ANTHROPIC_MODEL:claude-haiku-5-5}

# --- Heuristic frustration detection (can misfire; staff confirmation required) ---
app.frustration.enabled=${FRUSTRATION_ENABLED:true}
app.frustration.annoyed=${FRUSTRATION_ANNOYED:25}
app.frustration.frustrated=${FRUSTRATION_FRUSTRATED:55}
app.frustration.critical=${FRUSTRATION_CRITICAL:85}
app.frustration.decay-hours=${FRUSTRATION_DECAY_HOURS:12}
app.frustration.cooldown-minutes=${FRUSTRATION_COOLDOWN_MINUTES:30}
app.frustration.recheck-interval-ms=${FRUSTRATION_RECHECK_INTERVAL_MS:60000}
app.frustration.repeat-window-days=${FRUSTRATION_REPEAT_WINDOW_DAYS:7}
app.frustration.auto-escalate=${FRUSTRATION_AUTO_ESCALATE:false}
app.frustration.llm-sentiment=${FRUSTRATION_LLM_SENTIMENT:false}

# --- Optional SMTP (Outbox remains active without SMTP) ---
app.mail.enabled=${MAIL_ENABLED:true}
app.mail.from=${MAIL_FROM:itsmprojectzero@gmail.com}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:itsmprojectzero@gmail.com}
spring.mail.password=${MAIL_PASSWORD:sjbdghbjtfdtrqrg}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}

# --- Server ---
server.port=${SERVER_PORT:8080}

# --- Logging ---
logging.level.com.itsm=INFO
